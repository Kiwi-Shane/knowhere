# Opt-in D2 dependency harness.
#
# Apply this file together with docker-compose.dev.yml.  It intentionally uses
# distinct container and volume names so the host-integrated development stack
# remains untouched.  This is a synthetic dependency/application runtime
# harness; it does not by itself qualify the API, worker, or an active/private
# deployment.

x-d2-application-environment: &d2-application-environment
  ENVIRONMENT: development
  APP_ENV: development
  APP_VERSION: d2-synthetic
  LOG_LEVEL: INFO
  TMP_PATH: /tmp
  DATABASE_URL: postgresql+asyncpg://root@postgres:5432/Knowhere
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  DB_SSL_MODE: disable
  DB_USE_NULL_POOL: "true"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "2"
  DB_SYNC_POOL_SIZE: "2"
  DB_SYNC_MAX_OVERFLOW: "2"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  REDIS_MAX_CONNECTIONS: "5"
  CELERY_REDIS_URL: redis://redis:6379/1
  S3_TYPE: filesystem
  S3_BUCKET_NAME: d2-synthetic-uploads
  S3_ACCESS_KEY_ID: d2-synthetic-access
  S3_SECRET_ACCESS_KEY: d2-synthetic-secret
  S3_TEMP_PATH: /tmp
  OBJECT_STORAGE_LOCAL_ROOT: /tmp/object-storage
  S3_RESULTS_BUCKET: d2-synthetic-results
  S3_USE_SSL: "false"
  S3_ADDRESSING_STYLE: path
  S3_ENDPOINT_URL: ""
  TELEMETRY_ENABLED: "false"
  TELEMETRY_POSTHOG_HOST: http://127.0.0.1:9
  TELEMETRY_POSTHOG_PROJECT_KEY: ""
  LOGFIRE_TOKEN: ""
  API_STANDALONE_MODE_ENABLED: "true"
  BILLING_ENABLED: "false"
  LLM_MOCK_ENABLED: "true"
  MINERU_PROVIDER: cloud
  MINERU_LOCAL_PREFLIGHT_ON_STARTUP: "false"

services:
  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: knowhere_d2_redis
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    restart: "no"

  postgres:
    image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: knowhere_d2_postgres
    ports: !reset []
    read_only: true
    tmpfs:
      - /run/postgresql
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: "no"
    environment: !override
      POSTGRES_DB: Knowhere
      POSTGRES_USER: root
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    secrets:
      - postgres_password
    volumes: !override
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  localstack:
    image: localstack/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    container_name: knowhere_d2_localstack
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp
      - /root/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    extra_hosts: !reset []
    environment: !override
      SERVICES: s3,sns,sqs,iam,sts
      DEBUG: "0"
      PERSISTENCE: "1"
      DATA_DIR: /var/lib/localstack/data
      EXTENSION_AUTO_INSTALL: "0"
      SKIP_INFRA_DOWNLOADS: "1"
      HOSTNAME_EXTERNAL: localstack
      EDGE_PORT: "4566"
      SNS_ENDPOINT_STRATEGY: domain
      DOCKER_HOST: ""
    volumes: !override
      - localstack_data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d:ro

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      args:
        ENVIRONMENT: development
        APP_VERSION: d2-synthetic
        GIT_COMMIT: f79b3f1e
    image: knowhere-api:d2-synthetic
    container_name: knowhere_d2_api
    ports: !reset []
    expose:
      - "5005"
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    environment: !override
      <<: *d2-application-environment
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - knowhere_network
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        ENVIRONMENT: development
        APP_VERSION: d2-synthetic
        GIT_COMMIT: f79b3f1e
    image: knowhere-worker:d2-synthetic
    container_name: knowhere_d2_worker
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    environment: !override
      <<: *d2-application-environment
      WORKER_HEARTBEAT_FILE: /tmp/knowhere-worker-heartbeat.json
      WORKER_CONCURRENCY: "1"
      PYMUPDF_MAX_CONCURRENT: "1"
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - knowhere_network
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512

volumes:
  redis_data:
    name: knowhere_d2_redis_data
  postgres_data:
    name: knowhere_d2_postgres_data
  localstack_data:
    name: knowhere_d2_localstack_data

secrets:
  postgres_password:
    file: ./.d2-secrets/postgres_password

networks:
  knowhere_network:
    name: knowhere_d2_internal
    internal: true
